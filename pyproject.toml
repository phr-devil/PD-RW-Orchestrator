[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdrw-orchestrator"
version = "0.2.0"
description = "Evidence-aware, policy-guided scientific multi-agent orchestration foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7", "jsonschema>=4.21,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
pdrw-orch = "pdrw_orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
