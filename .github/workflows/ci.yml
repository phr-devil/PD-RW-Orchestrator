name: CI
on:
  push:
  pull_request:
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: pdrw-orch doctor
      - run: pdrw-orch codex contract
      - run: pdrw-orch demo
      - run: pdrw-orch advise --task-file examples/decision-task.example.json --result-file examples/agent-result-v2.example.json
  experience-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: phr-devil/PD-RW-Experience
          ref: 6f22e958233e1313171f4a6317642e0390445d10
          path: upstream-experience
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]" ./upstream-experience
      - run: python -m pytest -q tests/test_experience_retrieval.py
        env:
          PDRW_EXPERIENCE_TEST_ROOT: upstream-experience
